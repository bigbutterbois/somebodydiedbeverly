# Facts about each 2026 Senate race. Model knobs live in config.yaml.
#
# rep: the Republican candidate. opp: the main opposition candidate (usually
# the Democrat; an independent where they are the real challenger).
# caucus: who an opposition win counts toward: D, or none for independents
# who count for neither party (see config.yaml). Mike asked for every
# independent challenger (Osborn, Achilles, Bodnar, Bengs) to count as a Democrat.
# match: regex for the candidate's column on Wikipedia (default: last name).
# fec_first: first name to require when matching FEC fundraising records.
# pres_2024 / pres_2020: presidential margin in the state, Dem minus Rep, points.
# region: used for correlated polling error.

election_day: 2026-11-03
# Seats not on the ballot this year (53 R - 22 up, 47 D/I caucus - 13 up).
seats_not_up: { D: 34, R: 31 }
national_pres_2024: -1.5
national_pres_2020: 4.5

