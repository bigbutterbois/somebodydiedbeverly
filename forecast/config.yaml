# Senate forecast model settings. Edit, open a PR, merge: the next daily run
# uses them. Every snapshot records the config version it was made with.
# Margins are always in points, opposition (usually Dem) minus Republican.

version: 1

simulations: 20000

# --- Polling average -------------------------------------------------------
polls:
  half_life_days: 21          # a poll's weight halves every N days after it ends
  max_age_days: 120           # ignore polls older than this
  sample_size_reference: 600  # a poll of this size gets weight 1 (scales with sqrt(n))
  sample_size_cap: 1.6        # max sample-size weight, so one huge poll can't dominate
  population_weights: { LV: 1.0, RV: 0.85, A: 0.6, V: 0.85, unknown: 0.8 }
  # Polls sponsored by a party or campaign (marked (D) or (R) on Wikipedia):
  partisan_weight: 0.6        # weight multiplier
  partisan_shift: 2.0         # points moved against the sponsor's party
  # Each pollster's polls in a race share weight 1/sqrt(count), so one
  # firm polling weekly doesn't swamp the average.
  pollster_count_damping: true
  # Pollster ratings (Mike signed off 2026-10-03): weight multipliers keyed by
  # a case-insensitive pattern searched for in the pollster name as on
  # Wikipedia; the first match wins, so order matters. 0 drops a pollster.
  # Pollsters that match nothing get pollster_default_weight.
  pollster_default_weight: 0.85
  pollster_weights:
    "times/siena|siena.*times": 1.5
    "economist": 1.3
    "marist": 1.2
    "beacon|fox news": 1.2
    "emerson": 1.15
    "echelon": 1.1
    "yougov": 1.1                 # YouGov polls for other sponsors (CBS, Yahoo...)
    "quinnipiac": 1.0
    "ipsos": 1.0
    "cygnal": 1.0
    "trafalgar": 0.6              # before InsiderAdvantage, for their joint polls
    "insider ?advantage": 0.95
    "morning consult": 0.9
    "university of new hampshire": 0.9
    "co/?efficient": 0.9
    "change research": 0.85
    "abacus": 0.85
    "global strategy": 0.8
    "wedgewood": 0.7
    "activote": 0.7
    "big data poll": 0.6
    "quantus": 0.6
    "rasmussen": 0.5
  # Bipartisan polling teams: a (D) or (R) tag on one partner doesn't make the
  # poll partisan (Fox News, NBC News, AARP polls).
  bipartisan:
    - "beacon.*shaw"
    - "hart research.*public opinion strategies"
    - "fabrizio.*impact"
    - "cygnal.*beacon"
  # House effects: points a pollster leans toward Dems (negative = leans R).
  # Subtracted from that pollster's margins.
  house_effects: {}
  # Drop individual polls: { state: XX, pollster: "Name", end_date: 2026-09-01 }
  exclude: []
  # Rows on Wikipedia that are averages, not polls.
  aggregators:
    - race to the wh
    - silver bulletin
    - realclear
    - 270towin
    - decision desk
    - fiftyplusone
    - votehub
    - the hill
    - cook political
    - "538"
    - average

# --- Fundamentals ----------------------------------------------------------
fundamentals:
  # State partisan lean = state presidential margin minus the national margin,
  # blended across years.
  lean_weights: { "2024": 0.75, "2020": 0.25 }
  # Senate races are a bit less partisan than presidential ones: lean is scaled by this.
  lean_factor: 0.95
  # National environment (Dem lead nationally), blended from two signals:
  # the generic ballot average, and Trump's net approval translated into an
  # expected Dem lead (intercept + slope x net disapproval).
  generic_ballot_half_life_days: 14
  generic_ballot_weight: 0.8
  approval_weight: 0.2
  approval_half_life_days: 14
  approval_intercept: 1.0       # Dem lead when Trump's net approval is 0
  approval_slope: 0.3           # extra Dem lead per point of net disapproval
  approval_stale_days: 14       # no new approval poll for this long: start fading approval out
  approval_fade_days: 14        # ...reaching zero weight this many days later (generic ballot only)
  generic_ballot_fallback: 4.5  # used if the generic ballot scrape fails
  national_environment_override: null  # set a number to force it
  # Sitting senators running again get this many points.
  incumbency: 1.5
  appointed_incumbency_factor: 0.5   # appointed incumbents get half
  # Polls vs. fundamentals: the fundamentals prior counts as this many fresh,
  # full-weight polls. Lower = trust polls sooner.
  prior_weight_in_polls: 1.0
  # ...and it fades as Election Day nears, like Silver's model: full weight
  # until prior_fade_start_days out, then down in a straight line to
  # prior_weight_floor times that weight on Election Day (Mike: never below 30%).
  prior_fade_start_days: 120
  prior_weight_floor: 0.3
  # Polls never get more than this share of a race's expected margin, so the
  # fundamentals always count for at least 15% (Mike, 2026-10-06).
  max_poll_share: 0.85
  # Fundraising: individual contributions this cycle (FEC). Points per
  # doubling of one side's haul over the other's, capped.
  fundraising_points_per_doubling: 0.5
  fundraising_cap: 2.0
  # Big super PACs (Senate Leadership Fund, MAGA Inc. and America PAC for the
  # GOP; Senate Majority PAC and its WinSenate for Democrats): what each
  # spends in a race's general election, backing its side or attacking the other,
  # is added to its side's haul at this rate per dollar. Under 1 because candidates
  # get the lowest TV ad rates by law and super PACs pay market rates.
  super_pac_weight: 0.5
  # Election-day weather: Mike's call is that rain helps Democrats. Points
  # toward the opposition (usually Dem) per inch of forecast rain in the
  # state's biggest metro; negative flips it toward the GOP. Kicks in once
  # Nov 3 is within 16 days.
  weather_points_per_inch: 1.0
  weather_cap: 1.5

# --- Historical polling miss ----------------------------------------------
# Polls have tended to miss in the same direction cycle after cycle. This takes
# a share of the average past miss back off: off the generic ballot (national)
# and off every race's polling average (the national miss plus that state's own
# extra miss). The miss history is forecast/polling_miss.yaml, built from 538's
# archive of final-three-week polls by forecast/polling_miss.py.
polling_miss:
  correction: 0.5      # share of the average past miss to undo (0 = off, 1 = all of it)
  cycles: [2012, 2014, 2016, 2018, 2020, 2022, 2024]  # Mike, 2026-10-06; only cycles before the election are used
  state_shrinkage: 3   # a state's own miss is averaged as if it had 3 extra races that missed by 0

# --- Economy ---------------------------------------------------------------
# Market moves over the lookback window, added to the national environment.
# A better economy helps the president's party (now the GOP): a rising S&P 500
# counts as better, rising 10-year yields and Brent crude as worse. Source: FRED.
economy:
  lookback_days: 90
  sp500_points_per_10pct: 1.0   # S&P up 10% -> 1 pt toward the president's party
  yield_points_per_point: 1.0   # 10-year yield up 1 percentage point -> 1 pt against
  brent_points_per_10pct: 0.5   # Brent up 10% -> 0.5 pt against
  cap: 2.0                      # total economy effect is capped at this many points

# --- Simulation error (standard deviations, points of margin) --------------
error:
  national: 2.5               # shared by every race (polling miss / late swing)
  national_per_day: 0.02      # extra national error per day until the election
  regional: 1.8               # shared within a region (south, midwest, ...)
  state_polled: 4.5           # race-specific error when polls dominate
  state_unpolled: 7.0         # race-specific error when only fundamentals
  state_per_day: 0.02         # extra race error per day until the election
  independent_extra: 3.0      # extra race error when the challenger is an independent
  t_df: 5                     # degrees of freedom for fat-tailed draws (higher = more normal)

# --- Senate control --------------------------------------------------------
control:
  vice_president_party: R     # breaks 50-50 ties
  # How seats won by independents marked caucus: none in races.yaml count
  # (all current independents are caucus: D there, so they count for Democrats).
  # neither: they count for no one; D: they count toward Dem control.
  independents_count_as: neither

# --- Map / table categories (chance the leading side wins) ------------------
ratings:
  tossup_below: 0.60   # under 60%: Toss-up
  lean_below: 0.80     # 60-80%: Lean
  likely_below: 0.95   # 80-95%: Likely; 95%+: Safe

# --- Per-race adjustments ---------------------------------------------------
# candidate_quality: points added to the opposition margin (negative helps the
# Republican). override_margin: pin the race's mean margin. Keyed by state.
races:
  AK: { candidate_quality: 3.0, note: "Peltola won statewide in 2022 and 2024 House races" }
  ME: { candidate_quality: -5.0, note: "Collins has run far ahead of the state's lean" }
  NC: { candidate_quality: 2.0, note: "Cooper, two-term former governor" }
  NE: { candidate_quality: 5.0, note: "Osborn ran 13 points ahead of Harris in 2024" }
  OH: { candidate_quality: 3.0, note: "Brown, three-term former senator" }
  TX: { candidate_quality: 2.5, note: "Paxton: impeachment, scandals" }
  NH: { candidate_quality: -1.5, note: "Sununu, former senator and well-known name" }
  MT: { candidate_quality: 0.0, note: "Bodnar (I) splits the anti-Alme vote with Bankhead (D)" }

# --- House -----------------------------------------------------------------
# The House forecast uses every setting above; these replace the ones that
# differ for House races (same section and key names). Everything national
# (environment, economy, polling miss, poll weighting) is shared on purpose, so
# both forecasts always agree on the national picture.
house:
  fundamentals:
    # Districts' lean is from Cook PVI (2024 weighted 75%, 2020 25%, like lean_weights).
    # House races track the presidential vote closely, so it isn't scaled down.
    lean_factor: 1.0
    incumbency: 2.0
    # Candidate quality, automatic (Mike, 2026-10-06): this share of how far each
    # incumbent ran ahead of their district's lean plus the national House vote
    # in 2024, capped. Not used in states with new lines.
    overperformance_factor: 0.5
    overperformance_cap: 4.0
  error:
    state: 1.5                # shared by districts in the same state
  # Hand adjustments per district, like races: above, keyed by district id ("PA-07").
  races: {}
