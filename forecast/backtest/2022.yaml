# The 2022 Senate elections, for backtesting the model (forecast/backtest.py).
# Same shape as races.yaml, with the two prior presidential results (2020 and
# 2016) standing in for 2024 and 2020, plus each race's actual result.
# result: final margin, opposition (Dem, or McMullin in Utah) minus Republican, points.
# Alaska (Murkowski vs Tshibaka, both Republicans) is left out and counted as a
# Republican seat not up. Georgia uses the Nov 8 first round (Warnock led, then
# won the runoff).

election_day: 2022-11-08
president_party: D
seats_not_up: { D: 36, R: 30 }
national_pres_2020: 4.5
national_pres_2016: 2.1
actual_dem_seats: 51
generic_ballot_pages:
  - Nationwide_opinion_polling_for_the_2022_United_States_House_of_Representatives_elections
  - Opinion_polling_for_the_2022_United_States_House_of_Representatives_elections
  - 2022_United_States_House_of_Representatives_elections
generic_ballot_search: 2022 generic congressional ballot opinion polling
# Wikipedia has no 2022 generic ballot poll table, so the backtest falls back to
# these points from FiveThirtyEight's generic ballot average (Dem minus Rep,
# approximate, read off its chart).
generic_ballot_average:
  - { date: 2022-08-01, margin: 0.0 }
  - { date: 2022-08-15, margin: 0.5 }
  - { date: 2022-09-01, margin: 1.2 }
  - { date: 2022-09-15, margin: 1.5 }
  - { date: 2022-10-01, margin: 1.0 }
  - { date: 2022-10-15, margin: -0.5 }
  - { date: 2022-11-01, margin: -1.0 }
  - { date: 2022-11-07, margin: -1.2 }
approval_pages:
  - Opinion_polling_on_the_Joe_Biden_administration
approval_search: Opinion polling on the Joe Biden administration 2022 approval
approval_name: biden

races:
