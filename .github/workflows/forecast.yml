name: Forecast

# Runs the Senate forecast every morning at 6am US Eastern and publishes the
# results to the forecast-data branch, which the site reads. Repeated cron
# times from 6am Eastern on cover daylight and standard time and late or
# dropped GitHub schedules; the gate step skips any before 6am or on a day
# that already has a forecast. A model change merged to main
# reruns it right away. The first run (no published history yet) also
# backfills history from Sept 1. On a pull request that touches the model it
# does a dry run and prints the result instead.

on:
  schedule:
    # GitHub often starts scheduled runs hours late or drops them, worst at
    # the top of the hour (Oct 5's first start came at 3pm Eastern), so starts
    # sit at :17 and :47 through the morning, then hourly into the evening;
    # the gate runs only the first.
    - cron: "17,47 10-17 * * *"
    - cron: "17 18-23 * * *"
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Also rebuild history from this date (YYYY-MM-DD), optional"
        required: false
      force:
        description: "Run even if today's forecast already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "forecast/**"
      - ".github/workflows/forecast.yml"
  pull_request:
    paths:
      - "forecast/**"
      - ".github/workflows/forecast.yml"

permissions:
  contents: write

concurrency: forecast

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out published data
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: forecast-data
          path: data

      - name: Decide whether to run
        id: gate
        run: |
          today=$(TZ=America/New_York date +%F)
          hour=$(TZ=America/New_York date +%-H)
          last=$(jq -r '.as_of // ""' data/latest.json 2>/dev/null || true)
          run=true
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour" -lt 6 ] || [ "$last" = "$today" ]; }; then run=false; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$last" = "$today" ] \
            && [ "${{ inputs.force }}" != "true" ] && [ -z "${{ inputs.backfill_from }}" ]; then run=false; fi
          echo "Eastern $today ${hour}h, last forecast ${last:-none}, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt

      - if: steps.gate.outputs.run == 'true'
        run: pip install -r forecast/requirements.txt

      - name: Dry run
        if: github.event_name == 'pull_request'
        run: python forecast/run.py --dry-run --verbose

      # Replays the 2022 Senate cycle with this PR's config and with the base
      # branch's, to compare how well calibrated each is. Informational only.
      - name: Backtest on 2022
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:forecast/config.yaml > "$RUNNER_TEMP/base-config.yaml"
          python forecast/backtest.py --config forecast/config.yaml --config "$RUNNER_TEMP/base-config.yaml"

      - name: Run forecast
        if: github.event_name != 'pull_request' && steps.gate.outputs.run == 'true'
        run: |
          backfill="${{ inputs.backfill_from }}"
          if [ -z "$backfill" ] && [ ! -f data/history.json ]; then backfill=2026-09-01; fi
          python forecast/run.py --data-dir data ${backfill:+--backfill-from "$backfill"}

      - name: Publish
        if: github.event_name != 'pull_request' && steps.gate.outputs.run == 'true'
        working-directory: data
        run: |
          if [ ! -d .git ]; then
            git init -b forecast-data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Forecast for $(jq -r .as_of latest.json)" || { echo "nothing changed"; exit 0; }
          git push origin HEAD:forecast-data
